global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Uptime Kuma отдает метрики на эндпоинте /metrics (требуется включить в настройках Kuma)
  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['uptime-kuma:3001']

